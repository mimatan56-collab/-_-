<p class="eyebrow">סיפור גבורה</p><h1>רחל אדרי</h1><p class="sub">אופקים</p><hr>
<p class="t">רחל הייתה בביתה באופקים. כדי להגן על חייה, אירחה את המחבלים בביתה. מהחלון ראתה את בנה וסימנה לו בידיה שיש חמישה מחבלים. היא פחדה מאוד, שכן המחבלים איימו עליה ושמו רימון על ראשה, אך שמרה על קור רוח כל הזמן שהיו בביתה, ובסוף ניצלה בזכות קור רוחה.</p>
